resources:
  genie_spaces:
    bm_l_001:
      title: "Piping PoC — BM-L-001"
      description: >-
        Curated Genie agent scoped to piping project BM-L-001: line list,
        stage progress, true-up reconciliation, and ML-predicted completion
        times.
      parent_path: /Workspace/Users/${workspace.current_user.userName}/piping_poc_genie
      warehouse_id: ${var.warehouse_id}
      file_path: ../../src/genie/bm_l_001.geniespace.json
      # CAN_RUN on the space object itself governs who the Genie
      # Conversation API accepts requests from when a real user clicks this
      # project's dashboard's own built-in "Ask Genie" button (see
      # docs/ARCHITECTURE.md's "Dashboards + native Genie" section — Phase
      # 8b moved Genie access from an app-level plugin to purely this native,
      # per-dashboard mechanism). Without this block, only the bundle's
      # deploying identity could actually chat with the space;
      # every other real Estimator/Lead Engineer/Design Lead/Admin user would
      # get a 403. Group names are account-level groups (migrated from
      # workspace-local — see roles.ts) with a " Piping" suffix, not the
      # in-app role labels themselves.
      permissions:
        - group_name: Estimator Piping
          level: CAN_RUN
        - group_name: Lead Engineer Piping
          level: CAN_RUN
        - group_name: Design Lead Piping
          level: CAN_RUN
        - group_name: Admin Piping
          level: CAN_RUN
