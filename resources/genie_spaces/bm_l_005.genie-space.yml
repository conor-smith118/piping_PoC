resources:
  genie_spaces:
    bm_l_005:
      title: "Piping PoC — BM-L-005"
      description: >-
        Curated Genie agent scoped to piping project BM-L-005: line list,
        stage progress, true-up reconciliation, and ML-predicted completion
        times.
      parent_path: /Workspace/Users/${workspace.current_user.userName}/piping_poc_genie
      warehouse_id: ${var.warehouse_id}
      file_path: ../../src/genie/bm_l_005.geniespace.json
      # See bm_l_001.genie-space.yml for why this block is required (governs
      # who the Conversation API accepts OBO requests from).
      permissions:
        - group_name: Estimator Piping
          level: CAN_RUN
        - group_name: Lead Engineer Piping
          level: CAN_RUN
        - group_name: Design Lead Piping
          level: CAN_RUN
        - group_name: Admin Piping
          level: CAN_RUN
