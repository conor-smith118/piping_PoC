resources:
  jobs:
    refresh_silver_gold:
      name: "Piping PoC — Refresh Live + Gold Tables (from Lakebase CDC)"
      description: >-
        Dedups the lb_*_history CDC landing tables (populated by Lakehouse
        Sync from Lakebase) into live_* Delta tables, then rebuilds
        gold_line_status / gold_project_rollup. Chained after
        simulate_new_data (Phase 8); safe to run standalone/repeatedly.
      tasks:
        - task_key: refresh
          notebook_task:
            notebook_path: ../src/notebooks/etl/refresh_silver_gold.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          # no cluster config -> serverless
