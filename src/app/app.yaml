command: ['npm', 'run', 'start']
env:
  - name: LAKEBASE_ENDPOINT
    valueFrom: postgres
  # One dashboard per project now (Option B — see
  # docs/ARCHITECTURE.md), each natively linked to its own project's Genie
  # agent via that dashboard's own uiSettings.genieSpace.overrideId. Plain
  # literals, not permission-bearing resources — there's no AppKit
  # "dashboard" resource type (see server/routes/config.ts). Placeholder
  # values below get overwritten with the real ids once the 5 dashboards in
  # resources/dashboards/*.dashboard.yml are deployed for the first time
  # (`databricks bundle summary` or `databricks lakeview list` to read them
  # back).
  - name: DASHBOARD_ID_BM_L_001
    value: '01f1bc2d96af1c5d89b8da06e2ba6785'
  - name: DASHBOARD_ID_BM_L_002
    value: '01f1bc2d96ba1bceabffb8402ec8fb3c'
  - name: DASHBOARD_ID_BM_L_003
    value: '01f1bc2d96b91b408024f87ba463ccf7'
  - name: DASHBOARD_ID_BM_L_004
    value: '01f1bc2d96ba1c8387ea2175f5b1f8a8'
  - name: DASHBOARD_ID_BM_L_005
    value: '01f1bc2d96ce169f9c69b985af48289c'
